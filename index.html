<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/hrms/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Flutter replaces this with its own viewport tag once the engine starts;
       this one keeps phones from rendering the loading screen at 980px. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#35518E">
  <meta name="description" content="Houston Systems HRMS application.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Houston Systems">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Houston Systems HRMS</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #f4f7fc; }
    #app-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font: 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #35518E;
    }
    #app-loading .spinner {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid rgba(53, 81, 142, 0.2); border-top-color: #35518E;
      animation: app-loading-spin 0.9s linear infinite;
    }
    @keyframes app-loading-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Shown while the ~5 MB app downloads on mobile data; removed on the
       first Flutter frame so it never covers the app. -->
  <div id="app-loading" role="status">
    <img src="icons/Icon-192.png" width="72" height="72" alt="">
    <div class="spinner"></div>
    <div>Loading Houston Systems HRMS…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      if (el) el.remove();
    });
  </script>
  <script src='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs' type='module'></script>
  <script type='module'>
  var { pdfjsLib } = globalThis;
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';

  var pdfRenderOptions = {
    cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/',
    cMapPacked: true,
  }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
